# Reference Shairport Sync zone config (installed by future homepi-shairport service).
# Replace ZONE_ID and OUTPUT_DEVICE for each zone 1–16.

general =
{
  name = "HomePi Zone ZONE_ID";
};

sessioncontrol =
{
  active_state_timeout = 5.0;
};

alsa =
{
  output_device = "OUTPUT_DEVICE";
};

mqtt =
{
  enabled = "yes";
  hostname = "127.0.0.1";
  port = 1883;
  topic = "shairport/zone/ZONE_ID";
  publish_raw = "no";
  publish_parsed = "yes";
  publish_cover = "no";
};
